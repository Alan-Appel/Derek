   * Cada fotograma es render(t); todos los tiempos salen de la voz (timeline.js).

  @font-face { font-family: "Manrope"; font-weight: 200 800; font-display: block; src: url("../film/fonts/manrope-latin.woff2") format("woff2"); }
  :root { --paper: #F7F7F2; --ink: #171918; --accent: #527567; --page-bg: #E6E6DF; --ui: #85877f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-bg: #0d0e0d; --ui: #77786f; } }
  :root[data-theme="dark"] { --page-bg: #0d0e0d; --ui: #77786f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { background: var(--page-bg); font-family: "Manrope", system-ui, sans-serif; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; overflow: hidden; }
  #viewport { width: 100%; flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; overflow: hidden; background: var(--ink); flex: none; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.14); }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; background: var(--ink); }

  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: .08em .04em .18em; margin: -.08em -.04em -.18em; }
  .wi { display: inline-block; will-change: transform; }

  .lt { left: 90px; top: 1372px; color: var(--paper); }
  .lt > b { display: block; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
  .lt > span { display: block; font-size: 24px; font-weight: 500; letter-spacing: .04em; opacity: .6; margin-top: 4px; }
  .lt > i { position: absolute; left: -26px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: #86B39F; }
  .idx { left: 90px; top: 150px; color: var(--paper); font-size: 24px; font-weight: 700; letter-spacing: .14em; }
  .idx em { font-style: normal; color: #86B39F; margin-right: 14px; }
  #vals { left: 0; right: 0; top: 1300px; text-align: center; color: var(--paper); font-size: 60px; font-weight: 650; letter-spacing: -0.035em; }
  #vals .dotsep { color: #86B39F; }
  #emb { left: 160px; top: 780px; width: 760px; height: 222px; }
  #emb svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #tag { left: 0; right: 0; top: 1060px; text-align: center; font-size: 60px; font-weight: 600; letter-spacing: -0.03em; color: var(--ink); }
  #cred { left: 0; right: 0; top: 1205px; text-align: center; font-size: 26px; font-weight: 600; letter-spacing: .06em; color: #6f726c; }
  #caption { position: absolute; left: 90px; right: 90px; top: 1490px; display: flex; justify-content: center; pointer-events: none; }
  #caption span { background: rgba(23,25,24,.92); color: var(--paper); font-size: 40px; font-weight: 600; line-height: 1.3; padding: 14px 26px; border-radius: 18px; text-align: center; letter-spacing: -0.01em; max-width: 900px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  #temp { position: absolute; right: 60px; top: 60px; font-size: 20px; font-weight: 700; letter-spacing: .08em; padding: 8px 14px; border-radius: 10px; border: 2px solid currentColor; opacity: .5; }
  #controls { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 12px; color: var(--ui); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
  #controls button { font: inherit; color: inherit; background: none; border: 1px solid currentColor; border-radius: 999px; height: 32px; min-width: 32px; padding: 0 10px; cursor: pointer; flex: none; }
  #scrub { flex: 1; accent-color: var(--accent); min-width: 0; }
  body.render { padding: 0; background: var(--ink); }
  body.render #controls { display: none; }
  body.render #frame { border-radius: 0; box-shadow: none; }
</style>

<script>
(() => {
  "use strict";
  const TL = window.TIMELINE, CUES = window.CUES || [];
  const DUR = TL.duration;
  const $ = id => document.getElementById(id);
  const ctx = $("cv").getContext("2d");

  /* ============================ time from the voice ============================ */
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const line = p => TL.lines.find(l => l.id.startsWith(p));
  const W = (p, w) => { const l = line(p), k = l.words.find(q => norm(q.w).startsWith(norm(w))); return k ? k.t0 : l.start; };
  const T = {
    l1: line("01").start, c: W("01", "clientes"), p: W("01", "procesos"), i: W("01", "informacion"), o: W("01", "oportunidades"), mez: W("01", "mezclado"), l1e: line("01").end,
    l2: line("02").start, agreg: W("02", "agregando"), forma: W("02", "forma"), existe: W("02", "existe"), l2e: line("02").end,
    l3: line("03").start, rep: W("03", "repetitivo"), l3e: line("03").end,
    l4: line("04").start, oper: W("04", "operacion"), sist: W("04", "sistemas"), crm: W("04", "crm"), l4e: line("04").end,
    l5: line("05").start, sitios: W("05", "sitios"), tiendas: W("05", "tiendas"), encuen: W("05", "encuentren"), compren: W("05", "compren"), l5e: line("05").end,
    l6: line("06").start, herr: W("06", "herramientas"), existe6: W("06", "existe"), medida: W("06", "medida"), l6e: line("06").end,
    l7: line("07").start, invest: W("07", "investigamos"), prob: W("07", "probamos"), cons: W("07", "construimos"), l7e: line("07").end,
    l8: line("08").start, atajos: W("08", "atajos"), integ: W("08", "integridad"), disc: W("08", "disciplina"), resp: W("08", "respeto"), l8e: line("08").end,
    l9: line("09").start, l10: line("10").start, l10e: line("10").end,
  };

  /* ================================== math ================================== */
  function bez(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x;
      for (let i = 0; i < 8; i++) { const e = ((ax * t + bx) * t + cx) * t - x, d = (3 * ax * t + 2 * bx) * t + cx; if (Math.abs(e) < 1e-6 || !d) break; t -= e / d; }
      return ((ay * t + by) * t + cy) * t; };
  }
  const E = { travel: bez(0.65, 0, 0.35, 1), arrive: bez(0.16, 1, 0.3, 1), leave: bez(0.55, 0, 0.85, 0.3), whip: bez(0.8, 0, 0.18, 1), fold: bez(0.7, 0, 0.25, 1), lin: x => x };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const seg = (t, a, b, e = E.travel) => e(clamp((t - a) / (b - a)));
  function spring(x, f = 1.6, z = 0.6) { if (x <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x)); }
  const sp = (t, a, f, z) => spring(t - a, f, z);
  const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const v3 = (x, y, z) => ({ x, y, z });
  const add = (a, b) => v3(a.x + b.x, a.y + b.y, a.z + b.z);
  const sub = (a, b) => v3(a.x - b.x, a.y - b.y, a.z - b.z);
  const mulv = (a, k) => v3(a.x * k, a.y * k, a.z * k);
  const L3 = (a, b, p) => v3(lerp(a.x, b.x, p), lerp(a.y, b.y, p), lerp(a.z, b.z, p));
  const cross = (a, b) => v3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
  const dotp = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
  const nrm = a => { const l = Math.hypot(a.x, a.y, a.z) || 1; return v3(a.x / l, a.y / l, a.z / l); };
  const rotX = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return v3(p.x, p.y * c - p.z * s, p.y * s + p.z * c); };
  const rotY = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return v3(p.x * c + p.z * s, p.y, -p.x * s + p.z * c); };
  function noise2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, s = q => q * q * (3 - 2 * q);
    const h = (a, b) => rnd(a * 57.31 + b * 131.73 + 7.1);
    const u = s(xf), v = s(yf);
    return lerp(lerp(h(xi, yi), h(xi + 1, yi), u), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), u), v) * 2 - 1;
  }
  const PAPER = [247, 247, 242], SHADOW = [44, 47, 44], INKC = "#171918", GREEN = "#527567", GLOW = "#86B39F";
  const shadeCol = (b, tint = 0) => { const k = clamp(b); const c = PAPER.map((p, i) => Math.round(lerp(SHADOW[i], p, k) - tint * [6, 4, 10][i])); return `rgb(${c[0]},${c[1]},${c[2]})`; };

  /* ================================= camera ================================= */
  const F = 1500, CX = 540, CY = 860;
  let CAM, TNOW = 0;
  const K = [
    [0, v3(0, 0, 0), 1250, 0, 0.05],
    [T.mez + 0.6, v3(0, 0, 0), 1100, 0.15, 0.10, E.travel],
    [T.agreg, v3(0, 0, 0), 1650, 0.1, 0.08, E.travel],
    [T.existe + 0.4, v3(0, 0, 0), 1750, -0.32, 0.22, E.travel],
    [T.l3 + 0.5, v3(0, 0, 0), 1550, -0.28, 0.42, E.whip],
    [T.l4 - 0.2, v3(0, 0, 0), 1600, -0.18, 0.46, E.lin],
    [T.l4 + 0.6, v3(0, 0, 0), 1700, 0.3, 0.62, E.whip],          // look down into the tray
    [T.l5 - 0.2, v3(0, 0, 0), 1750, 0.42, 0.58, E.lin],
    [T.l5 + 0.4, v3(0, 0, 0), 1700, 0, 0.05, E.whip],            // facing the cupboard
    [T.encuen - 0.2, v3(0, 0, 0), 1650, 0, 0.02, E.lin],
    [T.compren + 0.4, v3(0, 0, -60), 1050, 0, 0, E.travel],      // into the light
    [T.l6 - 0.1, v3(0, 0, 0), 1500, 0, 0, E.travel],
    [T.l6 + 0.9, v3(0, 0, 0), 4700, 0.16, 0.12, E.whip],         // the other sheets arrive
    [T.l6e, v3(0, 0, 0), 4900, 0.10, 0.10, E.lin],
    [T.invest - 0.1, v3(0, -200, 0), 8200, 0, 0.14, E.whip],      // the horizon
    [T.cons - 0.2, v3(0, -200, 0), 8600, 0.06, 0.16, E.lin],
    [T.cons + 0.9, null, 6400, 0.22, 0.30, E.whip],                // toward the new form
    [T.l8 - 0.1, null, 6100, 0.28, 0.30, E.lin],
    [T.atajos + 0.6, v3(0, 0, 0), 2300, 0, 0, E.whip],            // our sheet, alone
    [T.l9 - 0.05, v3(0, 0, 0), 2300, 0, 0, E.lin],
    [T.l9 + 0.75, v3(0, 0, 0), 600, 0, 0, E.travel],              // the sheet becomes the page
    [DUR, v3(0, 0, 0), 600, 0, 0, E.lin],
  ];
  for (let i = 1; i < K.length; i++) K[i][0] = Math.max(K[i][0], K[i - 1][0] + 0.05);
  function camAt(t) {
    for (let i = 1; i < K.length; i++) {
      const a = K[i - 1], b = K[i];
      if (t <= b[0]) {
        const p = (b[5] || E.travel)(clamp((t - a[0]) / (b[0] - a[0])));
        const ta = a[1] || towerW(), tb = b[1] || towerW();
        return { tg: L3(ta, tb, p), dist: Math.exp(lerp(Math.log(a[2]), Math.log(b[2]), p)), yaw: lerp(a[3], b[3], p), pitch: lerp(a[4], b[4], p) };
      }
    }
    const k = K[K.length - 1]; return { tg: k[1], dist: k[2], yaw: k[3], pitch: k[4] };
  }
  function setCam(t) {
    const c = camAt(t), cy = Math.cos(c.yaw), sy = Math.sin(c.yaw), cp = Math.cos(c.pitch), spp = Math.sin(c.pitch);
    CAM = { ...c, cy, sy, cp, spp, pos: add(c.tg, mulv(v3(sy * cp, spp, cy * cp), -c.dist)) };
  }
  function P(p) {
    const dx = p.x - CAM.pos.x, dy = p.y - CAM.pos.y, dz = p.z - CAM.pos.z;
    const x1 = dx * CAM.cy - dz * CAM.sy, z1 = dx * CAM.sy + dz * CAM.cy;
    const y2 = dy * CAM.cp - z1 * CAM.spp, z2 = dy * CAM.spp + z1 * CAM.cp;
    if (z2 < 30) return null;
    const s = F / z2; return { x: CX + x1 * s, y: CY + y2 * s, s, z: z2 };
  }

  /* ================================= light ================================= */
  let LIGHT = nrm(v3(-0.35, -0.55, -1)), SPOT = null;
  function shade(n, worldPt) {
    const toCam = sub(CAM.pos, worldPt); if (dotp(n, toCam) < 0) n = mulv(n, -1);     // paper has two faces
    let b = 0.26 + 0.84 * Math.max(0, dotp(n, LIGHT));
    if (SPOT) { const d = Math.hypot(worldPt.x - SPOT.p.x, worldPt.y - SPOT.p.y, worldPt.z - SPOT.p.z); b = b * SPOT.dim + SPOT.k * Math.exp(-(d * d) / (SPOT.r * SPOT.r)); }
    return b;
  }

  /* ============================ the sheet (mesh) ============================ */
  const N = 36, S = 900, STEP = S / N;
  const UV = []; for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) UV.push([-S / 2 + i * STEP, -S / 2 + j * STEP]);
  const TRI = []; for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1; TRI.push([a, b, d]); TRI.push([a, d, c]); }

  function crumple(u, v, amp, ph) {
    const k = Math.min(1, amp);
    const x = u * (1 - 0.52 * k) + amp * 70 * noise2(u / 90 + 9, v / 90 + ph * 1.3);
    const y = v * (1 - 0.52 * k) + amp * 70 * noise2(u / 90 - 5, v / 90 + ph);
    const z = amp * (150 * noise2(u / 115 + ph * 1.7, v / 115 - ph * 0.9) + 70 * Math.abs(noise2(u / 48 + 3 + ph, v / 48 - 2)) - 35 + 28 * noise2(u / 22 - ph, v / 22 + 4)) + k * 0.0012 * (u * u + v * v);
    return v3(x, y, z);
  }
  function diag(u, v, g) {                      // the half u+v>0 folds over the diagonal toward the camera
    const s = (u + v) / Math.SQRT2; if (s <= 0) return v3(u, v, 0);
    const c = Math.cos(g), ap = (u - v) / 2;
    return v3(u * c + ap * (1 - c), v * c - ap * (1 - c), -s * Math.sin(g));
  }
  let PLEAT = null;
  function setPleats(th) {                      // accordion: 12 strips of 75, each with its own angle
    const X = [0], Z = [0];
    for (let i = 0; i < 12; i++) { const sg = i % 2 ? 1 : -1; X.push(X[i] + 75 * Math.cos(th[i])); Z.push(Z[i] + 75 * sg * Math.sin(th[i])); }
    PLEAT = { th, X, Z, xc: X[12] / 2, zc: (Math.min(...Z) + Math.max(...Z)) / 2 };
  }
  function pleat(u, v) {
    const q = u + S / 2, i = Math.min(11, Math.floor(q / 75 + 1e-6)), s = q - i * 75, sg = i % 2 ? 1 : -1;
    return v3(PLEAT.X[i] + s * Math.cos(PLEAT.th[i]) - PLEAT.xc, v, PLEAT.Z[i] + s * sg * Math.sin(PLEAT.th[i]) - PLEAT.zc);
  }
  function tray(u, v, al, h) {                  // walls up around a 600×600 floor, ridges inside
    const a = 300, dx = Math.max(0, Math.abs(u) - a), dy = Math.max(0, Math.abs(v) - a);
    const x = Math.sign(u) * (Math.min(Math.abs(u), a) + dx * Math.cos(al)), y = Math.sign(v) * (Math.min(Math.abs(v), a) + dy * Math.cos(al));
    let z = -Math.max(dx, dy) * Math.sin(al);
    if (dx === 0 && dy === 0) z -= h * Math.max(Math.max(0, 1 - Math.abs(u) / 50), Math.max(0, 1 - Math.abs(v) / 50));
    return v3(x, y, z);
  }
  function doors(u, v, be) {                    // cupboard fold: side panels over the centre, then open
    const a = 225; if (Math.abs(u) <= a) return v3(u, v, 0);
    const d = Math.abs(u) - a, sg = Math.sign(u);
    return v3(sg * (a + d * Math.cos(be)), v, -d * Math.sin(be));
  }

  function sheetShape(t) {
    const st = {};
    const flatten = seg(t, T.l2 + 0.15, T.forma - 0.1, E.travel);
    const tight = 1 + 0.18 * seg(t, T.mez - 0.1, T.mez + 0.4, E.arrive);
    st.amp = lerp(1.05 * tight, 0.03, flatten);                // the wrinkles stay as texture
    st.ph = [T.c, T.p, T.i, T.o, T.mez].reduce((a, w) => a + 0.35 * clamp(sp(t, w - 0.05, 2.2, 0.5), 0, 1.2), 0) + t * 0.05;

  const motion = x => {
    const ref = [v3(0, 0, 0), v3(450, 450, 0), v3(-450, -450, 0)];
    TNOW = x; setCam(x); const a = ref.map(P); TNOW = x + 1 / 30; setCam(x + 1 / 30); const b = ref.map(P); TNOW = t; setCam(t);
    let m = 0; a.forEach((p, i) => { if (p && b[i]) m = Math.max(m, Math.hypot(p.x - b[i].x, p.y - b[i].y)); });
    return m;
  };
  window.__film = { duration: DUR, seek: s => showT(s), motion };
  document.fonts.ready.then(() => showT(t));
  showT(t);
  if (!RENDER) requestAnimationFrame(tick);
})();
</script>
