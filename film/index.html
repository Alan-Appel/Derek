<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Derek · Punto de convergencia</title>
<style>
  /*
   * Derek — motion film prototype.
   * Every frame is a pure function of time: render(t). Geometry comes from
   * the wordmark itself (see GEO below and docs/motion-system.md).
   */
  @font-face {
    font-family: "Manrope"; font-weight: 200 800; font-display: block;
    src: url("fonts/manrope-latin.woff2") format("woff2");  /* SIL OFL 1.1 */
  }
  :root {
    --paper: #F6F5EF;
    --ink: #171917;
    --ui: #8b8a84;
    --page-bg: #E9E7E0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page-bg: #0f100f; --ui: #77766f; }
  }
  :root[data-theme="dark"] { --page-bg: #0f100f; --ui: #77766f; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--page-bg);
    font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px; overflow: hidden;
  }
  #viewport { width: 100%; flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; overflow: hidden; background: var(--paper); flex: none; }
  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; background: var(--paper); overflow: hidden;
  }
  #stage svg { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }

  .copy {
    position: absolute; left: 160px; top: 868px; width: 1200px;
    font-size: 40px; line-height: 1.2; font-weight: 500; letter-spacing: -0.012em;
    color: var(--ink); white-space: nowrap; will-change: clip-path, opacity;
  }
  .tagline {
    position: absolute; font-size: 34px; font-weight: 400; letter-spacing: -0.005em;
    color: var(--paper); white-space: nowrap;
  }

  #controls {
    width: 100%; max-width: 1100px; display: flex; align-items: center; gap: 14px;
    color: var(--ui); font-size: 13px; font-variant-numeric: tabular-nums; flex: none;
  }
  #controls button {
    font: inherit; color: inherit; background: none; border: 1px solid currentColor;
    border-radius: 999px; width: 34px; height: 34px; cursor: pointer; flex: none;
  }
  #scrub { flex: 1; accent-color: var(--ui); min-width: 0; }
  #act { min-width: 9em; text-align: right; }
  body.render #controls { display: none; }
  body.render { padding: 0; background: var(--paper); }
  @media (max-width: 520px) { #act { display: none; } }
</style>
</head>
<body>
<div id="viewport">
  <div id="frame">
    <div id="stage">
      <svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-label="derek">
        <defs>
          <mask id="m-e1" maskUnits="userSpaceOnUse" x="-5000" y="-5000" width="10000" height="10000">
            <rect x="-5000" y="-5000" width="10000" height="10000" fill="#fff"/>
            <rect id="m-e1-cut" fill="#000"/>
          </mask>
          <mask id="m-e2" maskUnits="userSpaceOnUse" x="-5000" y="-5000" width="10000" height="10000">
            <rect x="-5000" y="-5000" width="10000" height="10000" fill="#fff"/>
            <rect id="m-e2-cut" fill="#000"/>
          </mask>
          <clipPath id="c-armU" clipPathUnits="userSpaceOnUse"><rect id="c-armU-r"/></clipPath>
          <clipPath id="c-armL" clipPathUnits="userSpaceOnUse"><rect id="c-armL-r"/></clipPath>
          <clipPath id="c-wipe" clipPathUnits="userSpaceOnUse"><polygon id="c-wipe-p" points="0,0"/></clipPath>
        </defs>
        <rect id="bg" x="0" y="0" width="1920" height="1080" fill="var(--paper)"/>
        <g id="cam" style="color: var(--ink)">
          <g id="guides"></g>
          <g id="lattice"></g>
          <g id="logo"></g>
          <g id="marks"></g>
        </g>
        <g id="inverse" style="display:none" clip-path="url(#c-wipe)">
          <rect x="0" y="0" width="1920" height="1080" fill="var(--ink)"/>
          <g id="cam2"><use href="#logo" style="color: var(--paper)"/></g>
        </g>
      </svg>
      <div class="copy" id="copy"></div>
      <div class="tagline" id="tagline"></div>
    </div>
  </div>
</div>
<div id="controls">
  <button id="play" aria-label="Reproducir / pausar">❚❚</button>
  <span id="tc">00:00.0</span>
  <input id="scrub" type="range" min="0" max="48" step="0.01" value="0" aria-label="Línea de tiempo">
  <span id="act"></span>
</div>

<script>
(() => {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const DURATION = 48;

  /* ------------------------------------------------------------------ *
   * GEOMETRY — measured from the master wordmark (source px space).
   * The single most important fact: the OUTER edges of the two k arms,
   * extended, meet exactly on the stem's centre line at K0.
   * ------------------------------------------------------------------ */
  const GEO = {
    asc: 250, xh: 314, base: 491,
    stemW: 31, bowlR: 76, bowlW: 30, barW: 25, barY: 403.5,
    d:  { cx: 418, cy: 404, stemX: 498 },
    e1: { cx: 622, cy: 404 },
    r:  { stemX: 753, shoulderR: 50, termY: 328, termX: 833 },
    e2: { cx: 925.5, cy: 404 },
    k:  { stemX: 1054, tipX: 1079 },
    K0: { x: 1054, y: 396.7 },               // convergence point (inside the stem)
    mU: -0.7155,                              // upper arm slope  (35.6°, rising)
    mL:  0.8120,                              // lower arm slope  (39.1°, falling)
  };
  // k arms as outlines. The outer edge of each lies on a line through K0.
  const ARM_U = [[1079, 393], [1107.5, 393], [1217, 314.5], [1168.75, 314.5], [1079, 378.7]];
  const ARM_L = [[1079, 401.25], [1106, 401.25], [1216.5, 491], [1170, 491], [1079, 417.1]];
  const LOGO_BOX = { x0: 321, x1: 1217, y0: 250, y1: 491 };

  /* ----------------------------- easing ----------------------------- */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = t => ((ax * t + bx) * t + cx) * t;
    const sy = t => ((ay * t + by) * t + cy) * t;
    const dx = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || !d) break; t -= e / d; }
      return sy(Math.min(1, Math.max(0, t)));
    };
  }
  // Two curves only. No overshoot, no bounce — ever.
  const E = {
    travel: bezier(0.65, 0, 0.35, 1),   // movement between two known points
    arrive: bezier(0.16, 1, 0.3, 1),    // decisive arrival, long settle
    lin: x => x,
  };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (t, a, b, ease = E.travel) => ease(clamp((t - a) / (b - a)));
  const lerp = (a, b, p) => a + (b - a) * p;

  /* ------------------------------ build ------------------------------ */
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const $ = id => document.getElementById(id);
  const cam = $("cam"), cam2 = $("cam2"), logo = $("logo"), lat = $("lattice"), guides = $("guides"), marks = $("marks");

  const HAIR = { "vector-effect": "non-scaling-stroke", fill: "none", stroke: "var(--ink)" };

  // Lattice: two families of lines parallel to the k arms, spaced along the stem axis.
  const N = 22, S = 34, LX = 2300;
  const lattice = [];
  for (const [fam, m] of [["U", GEO.mU], ["L", GEO.mL]]) {
    for (let k = -N; k <= N; k++) {
      const line = el("line", { ...HAIR, "stroke-width": 1.15, "stroke-opacity": k === 0 ? 0.9 : 0.42 }, lat);
      lattice.push({ fam, m, k, line, y0: GEO.K0.y + k * S });
    }
  }

  // Construction guides: ascender, x-height, convergence axis, baseline.
  const guideDefs = [
    { y: GEO.asc, d: 0 }, { y: GEO.xh, d: 0.18 }, { y: GEO.K0.y, d: 0.36 }, { y: GEO.base, d: 0.54 },
  ].map(g => ({ ...g, line: el("line", { ...HAIR, "stroke-width": 1, "stroke-opacity": 0.22 }, guides) }));
  const vGuides = [GEO.d.stemX, GEO.r.stemX].map((x, i) => ({
    x, d: i * 0.25, line: el("line", { ...HAIR, "stroke-width": 1, "stroke-opacity": 0.22 }, guides),
  }));

  // Origin: the point, then the vertical that will become the k stem.
  const dot = el("circle", { r: 0, fill: "var(--ink)" }, marks);
  const vHair = el("line", { ...HAIR, "stroke-width": 1.25 }, marks);
  const knock = el("circle", { r: 0, fill: "var(--paper)" }, marks);

  // Wordmark parts (all drawn in currentColor so the inverse layer can reuse them).
  const SOLID = { fill: "none", stroke: "currentColor", "stroke-linecap": "butt" };
  const stemD = el("line", { ...SOLID, "stroke-width": GEO.stemW }, logo);
  const stemR = el("line", { ...SOLID, "stroke-width": GEO.stemW }, logo);
  const stemK = el("line", { ...SOLID, "stroke-width": 0 }, logo);
  const bar1 = el("line", { ...SOLID, "stroke-width": GEO.barW }, logo);
  const bar2 = el("line", { ...SOLID, "stroke-width": GEO.barW }, logo);

  const circlePath = (cx, cy, r) => `M ${cx + r} ${cy} A ${r} ${r} 0 1 0 ${cx - r} ${cy} A ${r} ${r} 0 1 0 ${cx + r} ${cy}`;
  const ePath = (cx, cy, r) => {
    const a = 20 * Math.PI / 180;
    return `M ${cx + r} ${cy} A ${r} ${r} 0 1 0 ${(cx + r * Math.cos(a)).toFixed(2)} ${(cy + r * Math.sin(a)).toFixed(2)}`;
  };
  const DRAW = { ...SOLID, "stroke-width": GEO.bowlW, pathLength: 1, "stroke-dasharray": "1 1" };
  const bowlD = el("path", { ...DRAW, d: circlePath(GEO.d.cx, GEO.d.cy, GEO.bowlR) }, logo);
  const bowlE1 = el("path", { ...DRAW, d: ePath(GEO.e1.cx, GEO.e1.cy, GEO.bowlR), mask: "url(#m-e1)" }, logo);
  const bowlE2 = el("path", { ...DRAW, d: ePath(GEO.e2.cx, GEO.e2.cy, GEO.bowlR), mask: "url(#m-e2)" }, logo);
  const R = GEO.r;
  const shoulder = el("path", {
    ...DRAW, "stroke-width": GEO.stemW,
    d: `M ${R.stemX} 420 L ${R.stemX} ${R.termY + R.shoulderR} A ${R.shoulderR} ${R.shoulderR} 0 0 1 ${R.stemX + R.shoulderR} ${R.termY} L ${R.termX} ${R.termY}`,
  }, logo);
  for (const [id, cx] of [["m-e1-cut", GEO.e1.cx], ["m-e2-cut", GEO.e2.cx]]) {
    const r = $(id); r.setAttribute("x", cx + 20); r.setAttribute("y", 416); r.setAttribute("width", 90); r.setAttribute("height", 28);
  }

  // k arms: outlines with the soft tip corner of the master drawing.
  const armPath = (p, tipIndex) => {
    let d = "";
    p.forEach(([x, y], i) => {
      if (i === tipIndex) {
        const prev = p[i - 1], next = p[(i + 1) % p.length], r = 9;
        const toward = (q, len) => { const dx = q[0] - x, dy = q[1] - y, L = Math.hypot(dx, dy); return [x + dx / L * len, y + dy / L * len]; };
        const a = toward(prev, r), b = toward(next, r);
        d += ` L ${a[0]} ${a[1]} Q ${x} ${y} ${b[0]} ${b[1]}`;
      } else d += `${i ? " L" : "M"} ${x} ${y}`;
    });
    return d + " Z";
  };
  const ARM_ATTR = { fill: "currentColor", stroke: "currentColor", "stroke-width": 2, "stroke-linejoin": "round" };
  const armU = el("path", { ...ARM_ATTR, d: armPath(ARM_U, 4), "clip-path": "url(#c-armU)" }, logo);
  const armL = el("path", { ...ARM_ATTR, d: armPath(ARM_L, 4), "clip-path": "url(#c-armL)" }, logo);
  const clipU = $("c-armU-r"), clipL = $("c-armL-r");
  for (const c of [clipU, clipL]) { c.setAttribute("y", 200); c.setAttribute("height", 400); }

  const set = (n, a) => { for (const k in a) n.setAttribute(k, a[k]); };
  const hideLine = n => set(n, { x1: 0, y1: 0, x2: 0, y2: 0, visibility: "hidden" });
  const showLine = (n, x1, y1, x2, y2) => set(n, { x1, y1, x2, y2, visibility: "visible" });

  /* ------------------------------ copy ------------------------------- */
  const COPY = [
    { a: 0.9,  b: 4.9,  text: "Todo empieza en un punto." },
    { a: 6.6,  b: 11.6, text: "Desde ahí, los caminos se multiplican." },
    { a: 13.4, b: 16.9, text: "Elegir es saber renunciar." },
    { a: 17.3, b: 20.7, text: "Y tener claro por qué." },
    { a: 22.0, b: 27.8, text: "Después, construir. Con medida, sin atajos." },
    { a: 29.4, b: 34.4, text: "Hasta que todo apunta en la misma dirección." },
  ];
  const TAGLINE = { a: 43.2, text: "Cada línea, con intención." };
  const ACTS = [
    [0, "I · Origen"], [6, "II · Posibilidades"], [13, "III · Criterio"], [21, "IV · Construcción"],
    [29, "V · Convergencia"], [35, "VI · Forma"], [41, "VII · Firma"],
  ];
  const copyEl = $("copy"), tagEl = $("tagline");
  tagEl.textContent = TAGLINE.text;

  /* ----------------------------- camera ------------------------------ */
  const LOGO_C = { x: (LOGO_BOX.x0 + LOGO_BOX.x1) / 2, y: (LOGO_BOX.y0 + LOGO_BOX.y1) / 2 };
  const FINAL_S = 1.12, FINAL_SCREEN_Y = 500;
  function camera(t) {
    // Act I–III: centred on the origin point, slowly widening.
    let s = lerp(2.6, 1.32, seg(t, 5.2, 14, E.travel));
    s *= lerp(1, 1.04, seg(t, 14, 21, E.lin));                   // imperceptible push while choosing
    let cx = GEO.K0.x, cy = GEO.K0.y, sy = 540;
    const p = seg(t, 20.8, 26, E.travel);                          // reframe onto the full word
    s = lerp(s, FINAL_S, p);
    cx = lerp(cx, LOGO_C.x, p); cy = lerp(cy, LOGO_C.y, p); sy = lerp(540, FINAL_SCREEN_Y, p);
    s *= lerp(1, 1.025, seg(t, 26, DURATION, E.lin));               // slow breath to the end
    return { s, cx, cy, sx: 960, sy };
  }

  /* ------------------------------ render ----------------------------- */
  function render(t) {
    const c = camera(t);
    const tf = `translate(${c.sx} ${c.sy}) scale(${c.s}) translate(${-c.cx} ${-c.cy})`;
    cam.setAttribute("transform", tf); cam2.setAttribute("transform", tf);
    const world = { x0: c.cx - c.sx / c.s - 50, x1: c.cx + (1920 - c.sx) / c.s + 50, y0: c.cy - c.sy / c.s - 50, y1: c.cy + (1080 - c.sy) / c.s + 50 };
    const K0 = GEO.K0;

    // I · the point, then the vertical through it
    const dotP = seg(t, 0.4, 1.1, E.arrive) * (1 - seg(t, 23.6, 24.4));
    set(dot, { cx: K0.x, cy: K0.y, r: 5.5 / c.s * dotP });
    const vUp = seg(t, 1.3, 3.6, E.travel), trim = seg(t, 23.4, 25.0, E.travel);
    if (vUp > 0 && trim < 1) {
      const top = lerp(K0.y, lerp(world.y0, GEO.asc, trim), vUp);
      const bot = lerp(K0.y, lerp(world.y1, GEO.base, trim), vUp);
      showLine(vHair, K0.x, top, K0.x, bot);
    } else hideLine(vHair);

    // II/III · lattice radiates from the stem axis, then all but two lines withdraw
    for (const L of lattice) {
      const a = Math.abs(L.k);
      const grow = seg(t, 6.0 + a * 0.19, 7.7 + a * 0.19, E.travel);
      let left = grow, right = grow;
      if (L.k !== 0) {
        const back = seg(t, 13.0 + (N - a) * 0.2, 14.5 + (N - a) * 0.2, E.travel);
        left = right = grow * (1 - back);
      } else {
        left = grow * (1 - seg(t, 29.0, 30.6, E.travel));          // V · the past withdraws into K0
        right = grow * (1 - seg(t, 32.2, 33.6, E.travel));         // … then the guide itself
      }
      if (left <= 0.0005 && right <= 0.0005) { hideLine(L.line); continue; }
      const xa = K0.x - LX * left, xb = K0.x + LX * right;
      showLine(L.line, xa, L.y0 + L.m * (xa - K0.x), xb, L.y0 + L.m * (xb - K0.x));
    }

    // IV · construction guides and stems
    const gFade = 1 - seg(t, 38.2, 39.8, E.travel);
    for (const g of guideDefs) {
      const p = seg(t, 21.4 + g.d, 23.6 + g.d, E.travel);
      if (p <= 0 || gFade <= 0) { hideLine(g.line); continue; }
      showLine(g.line, world.x0, g.y, lerp(world.x0, world.x1, p), g.y);
      g.line.setAttribute("stroke-opacity", 0.22 * gFade);
    }
    for (const g of vGuides) {
      const p = seg(t, 22.6 + g.d, 24.2 + g.d, E.travel);
      if (p <= 0 || gFade <= 0) { hideLine(g.line); continue; }
      showLine(g.line, g.x, world.y0, g.x, lerp(world.y0, world.y1, p));
      g.line.setAttribute("stroke-opacity", 0.22 * gFade);
    }
    const sk = seg(t, 23.6, 25.0, E.arrive);
    set(stemK, { x1: K0.x, y1: GEO.base, x2: K0.x, y2: GEO.asc, "stroke-width": GEO.stemW * sk, visibility: sk > 0 ? "visible" : "hidden" });
    const sd = seg(t, 24.2, 25.8, E.arrive), sr = seg(t, 24.7, 26.1, E.arrive);
    showLine(stemD, GEO.d.stemX, GEO.base, GEO.d.stemX, lerp(GEO.base, GEO.asc, sd)); stemD.style.visibility = sd > 0 ? "visible" : "hidden";
    showLine(stemR, GEO.r.stemX, GEO.base, GEO.r.stemX, lerp(GEO.base, 380, sr)); stemR.style.visibility = sr > 0 ? "visible" : "hidden";
    for (const [bar, cx, a] of [[bar1, GEO.e1.cx, 25.6], [bar2, GEO.e2.cx, 26.0]]) {
      const p = seg(t, a, a + 1.5, E.arrive), x0 = cx - 70;
      showLine(bar, x0, GEO.barY, lerp(x0, cx + 90.5, p), GEO.barY); bar.style.visibility = p > 0 ? "visible" : "hidden";
    }

    // V · convergence: the arms travel inward along their guides and stop short of the stem
    const au = seg(t, 30.2, 32.6, E.arrive), al = seg(t, 30.45, 32.85, E.arrive);
    set(clipU, { x: lerp(1222, 1076, au), width: 200 });
    set(clipL, { x: lerp(1222, 1076, al), width: 200 });
    armU.style.visibility = au > 0 ? "visible" : "hidden";
    armL.style.visibility = al > 0 ? "visible" : "hidden";
    // the origin, seen once more — inside the stem, where the arms point
    const kn = seg(t, 33.6, 34.0, E.arrive) * (1 - seg(t, 34.5, 35.0, E.travel));
    set(knock, { cx: K0.x, cy: K0.y, r: 4.2 * kn });

    // VI · the curves close the word
    for (const [path, a, d] of [[bowlD, 35.0, 2.2], [bowlE1, 35.4, 2.4], [shoulder, 35.9, 1.6], [bowlE2, 36.3, 2.4]]) {
      const p = seg(t, a, a + d, E.travel);
      path.setAttribute("stroke-dashoffset", 1 - p);
      path.style.visibility = p > 0 ? "visible" : "hidden";
    }

    // VII · inversion: a wipe on the lower-arm angle, bottom-left to top-right
    const w = seg(t, 41.0, 42.7, E.travel);
    const inv = $("inverse");
    if (w > 0) {
      inv.style.display = "";
      // half-plane bounded by a line of slope mL, swept along its normal
      const m = GEO.mL, span = 1920 * Math.abs(m) + 1080 + 40;
      const c0 = 1080 + 20 - span * w;            // y-intercept of the edge at x = 0 (screen)
      const yAt = x => c0 + m * x;
      $("c-wipe-p").setAttribute("points", `-10,${yAt(-10)} 1930,${yAt(1930)} 1930,5000 -10,5000`);
    } else inv.style.display = "none";

    // copy
    let line = null;
    for (const cp of COPY) if (t >= cp.a && t < cp.b) line = cp;
    if (line) {
      if (copyEl.textContent !== line.text) copyEl.textContent = line.text;
      const inP = seg(t, line.a, line.a + 0.9, E.arrive), outP = seg(t, line.b - 0.5, line.b, E.travel);
      copyEl.style.clipPath = `inset(-20% ${100 - inP * 100}% -20% 0)`;
      copyEl.style.opacity = 1 - outP;
    } else copyEl.style.opacity = 0;

    // tagline sits on the wordmark's left edge, one x-height below the baseline
    const tp = seg(t, TAGLINE.a, TAGLINE.a + 1.1, E.arrive);
    const lx = c.sx + (LOGO_BOX.x0 - c.cx) * c.s, ly = c.sy + (GEO.base - c.cy) * c.s;
    tagEl.style.left = `${lx + 4}px`;
    tagEl.style.top = `${ly + (GEO.base - GEO.xh) * c.s * 0.9}px`;
    tagEl.style.clipPath = `inset(-20% ${100 - tp * 100}% -20% 0)`;
    tagEl.style.opacity = tp > 0 ? 1 : 0;

  }

  /* --------------------------- playback ------------------------------ */
  const stage = $("stage"), frame = $("frame"), viewport = $("viewport");
  const scrub = $("scrub"), tc = $("tc"), playBtn = $("play"), actEl = $("act");
  const params = new URLSearchParams(location.search);
  const RENDER = params.has("render");
  if (RENDER) document.body.classList.add("render");

  function fit() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const k = RENDER ? 1 : Math.min(vw / 1920, vh / 1080);
    frame.style.width = `${1920 * k}px`; frame.style.height = `${1080 * k}px`;
    stage.style.transform = `scale(${k})`;
  }
  addEventListener("resize", fit); fit();

  let t = Number(params.get("t")) || 0, playing = !RENDER, last = null;
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${(s % 60).toFixed(1).padStart(4, "0")}`;
  function show(time) {
    t = clamp(time, 0, DURATION);
    render(t);
    scrub.value = t; tc.textContent = fmt(t);
    let a = ACTS[0][1]; for (const [s, n] of ACTS) if (t >= s) a = n; actEl.textContent = a;
  }
  function tick(now) {
    if (playing) {
      if (last != null) show(t + (now - last) / 1000);
      if (t >= DURATION) { playing = false; playBtn.textContent = "▶"; }
    }
    last = now;
    if (!RENDER) requestAnimationFrame(tick);
  }
  playBtn.addEventListener("click", () => {
    if (t >= DURATION) t = 0;
    playing = !playing; playBtn.textContent = playing ? "❚❚" : "▶";
  });
  scrub.addEventListener("input", () => { playing = false; playBtn.textContent = "▶"; show(Number(scrub.value)); });
  addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); playBtn.click(); } });

  // Deterministic hook for the offline renderer (tools/render.mjs).
  window.__film = { duration: DURATION, seek: s => show(s) };
  show(t);
  if (!RENDER) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
